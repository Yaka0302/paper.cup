<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おんがくこうさくらんど</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎵 おんがくこうさくらんど</h1>
</header>

<main>
  <section class="panel">
    <h2>つくるものを えらぼう</h2>
    <div id="craftGrid" class="grid"></div>
  </section>

  <section class="panel">
    <h2 id="craftTitle"></h2>
    <div id="steps" class="steps"></div>

    <div class="actions">
      <a id="pdfLink" class="btn pdf" download>📄 かたがみPDFを ダウンロード</a>
    </div>

    <div class="actions">
      <button id="nextBtn" class="btn next">こうさくが おわったら つぎへ ▶</button>
    </div>
  </section>

  <section id="cameraPanel" class="panel camera-panel">
    <h2 id="cameraTitle">こうさくを もってね</h2>

    <div class="camera-frame">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="guide" class="guide">おんがくあそびを はじめよう！</div>

    <div class="actions">
      <button id="playBtn" class="btn music">🎵 おんがくあそび</button>
      <button id="stopBtn" class="btn stop">⏹ とめる</button>
      <button id="closeBtn" class="btn stop">◀ もどる</button>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
